services:
  - type: web
    name: atlas-twitch-clipper
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_REFRESH_TOKEN
        sync: false
      - key: TWITCH_REDIRECT_URI
        value: https://www.autoeditor.app/atlas-clips/auth/twitch/callback
      - key: FRONTEND_URL
        value: https://www.autoeditor.app
      - key: CORS_ORIGINS
        value: https://www.autoeditor.app,http://localhost:5173,http://localhost:3000
      - key: TWITCH_CATEGORY_FILTER
        sync: false
      - key: CLIP_SCORE_THRESHOLD
        value: "3.0"
      - key: CLIP_COOLDOWN_SECONDS
        value: "30"
      - key: ENABLE_AUDIO_DETECTOR
        value: "true"
      - key: FALLBACK_CLIP_INTERVAL
        value: "300"
      - key: ENABLE_VOICE_COMMANDS
        value: "true"
      - key: AUTO_START
        value: "true"
      - key: PORT
        value: "10000"
